name: Convert SVG Flags to PNG

on:
  push:
    paths:
      - 'flags/**/*.svg'
  workflow_dispatch:

jobs:
  convert-flags:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inkscape
        run: sudo apt-get update && sudo apt-get install -y inkscape

      - name: Convert SVG to PNG
        working-directory: flags_png
        run: |
          chmod +x convert.sh
          ./convert.sh

      - name: Commit and push changes
        run: |
          # Configure Git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Add and commit changes
          git add flags_png/*
          git commit -m "chore: Auto-convert SVG flags to PNG" || echo "No changes to commit"
      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Output summary
        if: always()
        run: |
          echo "## Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **SVG files processed**: $(find flags -name "*.svg" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **PNG files generated**: $(find flags_png -name "*.png" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tool used**: Inkscape with transparent background" >> $GITHUB_STEP_SUMMARY
          echo "- **Output size**: 512x512 pixels" >> $GITHUB_STEP_SUMMARY



