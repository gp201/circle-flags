name: Convert SVG Flags to PNG

on:
  push:
    paths:
      - 'flags/**/*.svg'
  pull_request:
    paths:
      - 'flags/**/*.svg'
  workflow_dispatch:

jobs:
  convert-flags:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Install Inkscape
      run: |
        sudo apt-get update
        sudo apt-get install -y inkscape

    - name: Verify Inkscape installation
      run: |
        inkscape --version
        echo "Inkscape successfully installed"

    - name: Make convert script executable
      run: chmod +x flags_png/convert.sh

    - name: Convert SVG to PNG
      run: |
        cd flags_png
        ./convert.sh

    - name: Check conversion results
      run: |
        echo "Checking conversion results..."
        png_count=$(find flags_png -name "*.png" -not -name "convert.sh" | wc -l)
        svg_count=$(find flags -name "*.svg" | wc -l)
        echo "SVG files found: $svg_count"
        echo "PNG files generated: $png_count"
        
        if [ $png_count -eq 0 ]; then
          echo "⚠️ No PNG files were generated!"
          exit 1
        else
          echo "✅ Successfully generated $png_count PNG files"
        fi

    - name: Check for changes
      id: check-changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add flags_png/
        if git diff --staged --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected in PNG files"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in PNG files"
          git diff --staged --name-only
        fi

    - name: Commit changes
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        git commit -m "Auto-convert SVG flags to PNG with transparent background

        - Converted SVG flags to PNG format (512x512 pixels)
        - Maintained transparent background using Inkscape
        - Updated $(git diff --staged --name-only | wc -l) PNG files"

    - name: Create Pull Request
      if: steps.check-changes.outputs.changes == 'true' && github.event_name == 'push'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Auto-convert SVG flags to PNG with transparent background"
        title: "🔄 Auto-convert SVG flags to PNG"
        body: |
          This PR was automatically created to convert updated SVG flags to PNG format.
          
          ## Changes
          - Converted SVG flags to PNG format (512x512 pixels)
          - Maintained transparent background using Inkscape
          - Generated high quality PNG files from SVG sources
          
          ## Files Changed
          Updated PNG files in the `flags_png/` directory to match the latest SVG flags.
          
          ## Quality Assurance
          - ✅ All conversions use transparent background
          - ✅ Consistent 512x512 pixel size
          - ✅ High quality output using Inkscape
          - ✅ Automated generation ensures consistency
          
          ---
          *This PR was automatically generated by GitHub Actions*
        branch: auto-convert-flags
        delete-branch: true
        base: main

    - name: Output summary
      if: always()
      run: |
        echo "## Conversion Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **SVG files processed**: $(find flags -name "*.svg" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- **PNG files generated**: $(find flags_png -name "*.png" -not -name "convert.sh" | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- **Changes detected**: ${{ steps.check-changes.outputs.changes }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Tool used**: Inkscape with transparent background" >> $GITHUB_STEP_SUMMARY
        echo "- **Output size**: 512x512 pixels" >> $GITHUB_STEP_SUMMARY
